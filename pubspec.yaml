flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "lib/utils/images/vistalogo-new.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "lib/utils/images/vistalogo-new.png"
  min_sdk_android: 19
  web:
    generate: true
    image_path: "lib/utils/images/vistalogo-new.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "lib/utils/images/vistalogo-new.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "lib/utils/images/vistalogo-new.png"

dev_dependencies:
  isar_generator: ^3.1.0+1
  # drift_dev: ^2.16.0  # Replaced with Sembast
  # isar_generator: ^3.1.0+1  # Replaced with Sembast
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  riverpod_generator: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/utils/images/vistalogo.png
    - lib/utils/images/vistalogo-new.png
    - lib/utils/images/support_icon.png
    - lib/utils/images/headerBack.jpg
    - lib/utils/images/default-avatar.jpg
    - lib/utils/images/logo/
    - lib/utils/images/bottomnavigation/
    - lib/utils/images/component/
    - lib/utils/images/component/reels.png
    - lib/utils/images/share_icons/
    - lib/utils/images/wallpapers/dark_wallpaper.png
    - lib/utils/images/wallpapers/light_wallpaper.png
    - assets/images/modern_bg.jpg
    - assets/images/vista_custom_bg.png
    - assets/images/vista_custom_bg_dark.png
    - assets/images/match_icon.png
    - assets/sounds/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: lib/utils/fonts/VazirmatnLight.ttf
          weight: 300
        - asset: lib/utils/fonts/VazirmatnRegular.ttf
          weight: 400
        - asset: lib/utils/fonts/VazirmatnMedium.ttf
          weight: 500
        - asset: lib/utils/fonts/VazirmatnSemiBold.ttf
          weight: 600
        - asset: lib/utils/fonts/VazirmatnBold.ttf
          weight: 700
        - asset: lib/utils/fonts/VazirmatnExtraBold.ttf
          weight: 800
        - asset: lib/utils/fonts/VazirmatnBlack.ttf
          weight: 900
    - family: Bauhaus
      fonts:
        - asset: lib/utils/fonts/BauhausBold.ttf
