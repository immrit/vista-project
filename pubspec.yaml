  get_thumbnail_video: ^0.7.3
  voice_message_package: ^2.2.1
  dart_jsonwebtoken: ^3.2.0
  flutter_colorpicker: ^1.0.3
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2

dependency_overrides:
  intl: ^0.19.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "lib/view/util/images/vistalogo-new.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "lib/view/util/images/vistalogo-new.png"
  min_sdk_android: 19
  web:
    generate: true
    image_path: "lib/view/util/images/vistalogo-new.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "lib/view/util/images/vistalogo-new.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "lib/view/util/images/vistalogo-new.png"

dev_dependencies:
  # drift_dev: ^2.16.0  # Replaced with Sembast
  # isar_generator: ^3.1.0+1  # Replaced with Sembast
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - lib/view/util/images/vistalogo.png
    - lib/view/util/images/vistalogo-new.png
    - lib/view/util/images/headerBack.jpg
    - lib/view/util/images/default-avatar.jpg
    - lib/view/util/images/logo/
    - lib/view/util/images/bottomnavigation/
    - lib/view/util/images/component/
    - lib/view/util/images/component/reels.png
    - lib/view/util/images/share_icons/
    - lib/view/util/images/wallpapers/
  fonts:
    - family: Vazir
      fonts:
        - asset: lib/view/util/fonts/Vazir.ttf
    - family: Bauhaus
      fonts:
        - asset: lib/view/util/fonts/BauhausBold.ttf
