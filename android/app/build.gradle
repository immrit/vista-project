
plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ir.coffevista.vista"
    compileSdk = 36
    ndkVersion = "29.0.13846066" // Using available NDK version

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "ir.coffevista.vista"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 34
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Sign with the real key only when key.properties is present;
            // otherwise fall back to debug signing so the build doesn't fail
            // with "SigningConfig release is missing required property storeFile"
            // (e.g. in a worktree/CI without the machine-local keystore).
            signingConfig hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug
            // BF3: R8 code-shrink + resource-shrink for release. Smaller, harder
            // to reverse-engineer APK. Keep rules in proguard-rules.pro are
            // comprehensive (Flutter, media plugins, app pkg, AWS, Adtrace).
            // NOTE: not exercised by `flutter test`; smoke-test a release build
            // before shipping. Revert to false if a release-only crash appears.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // BF2: ship only ARM ABIs in release. Drops x86_64 native packaging
            // (ffmpeg/isar .so) → smaller APK + less native merge/strip work.
            // Debug keeps all ABIs for x86_64 emulator coverage.
        }
        
        // Debug uses the release signing config ONLY when the keystore exists
        // (keeps Firebase/Poolakey SHA matching for the maintainer). Without
        // key.properties it falls back to the default debug keystore so debug
        // builds work everywhere instead of failing on a missing storeFile.
        debug {
            signingConfig hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Add Google Play Core for Flutter deferred components references used by Flutter embedding
    implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.google.android.play:core-ktx:1.8.1'
    // 🔴 این خط را حتما اضافه کنید تا نسخه جدید و بدون باگ بازار استفاده شود
    implementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    
    // Adtrace SDK
    implementation 'io.adtrace:android-sdk:2.6.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}
