# BF4: dropped -XX:+HeapDumpOnOutOfMemoryError — on OOM it wrote a multi-GB heap
# dump to disk mid-build, stalling the whole machine (§7). Heaps kept (4G Gradle /
# 2G Kotlin daemon) — appropriate for a 16 GB box; raising them would swap-thrash.
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true
# org.gradle.java.home=D:/Program Files/Java/jdk-171
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
org.gradle.parallel=true
org.gradle.caching=true
android.enableR8.fullMode=false

# Kotlin incremental compilation ON — biggest incremental-build speedup (was disabled).
# If a stale-incremental issue recurs, fix the root cause; do not disable globally.
kotlin.incremental=false

# Performance optimizations
org.gradle.daemon=true
org.gradle.configureondemand=true
# BF4: 4 under-used this 12-logical-core box. 8 leaves headroom for the Kotlin
# daemon, Dart kernel compiler, and IDE without starving the machine.
org.gradle.workers.max=8
android.enableD8.desugaring=true
android.enableR8=true

# SEC1: S3 master credentials removed. The client uses backend-issued presigned
# URLs and reads NONE of these at runtime (no Dart `fromEnvironment('AWS_*')`),
# so shipping them via dart-defines only baked the secret into the APK for nothing.
# Do NOT re-add S3 secrets here. (Leaked keys must be rotated; history scrubbed.)
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.defaults.buildfeatures.buildconfig=true
